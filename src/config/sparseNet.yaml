system_model:
  N: 7
  M: 10
  T: 500
  snr: 10
  eta: 0.0
  bias: 0.0
  sv_noise_var: 0.0
  field_type: "Far"
  signal_nature: "non-coherent"
  array_form: "mra-7"
  antenna_pattern: false
  doa_range: [-70, 70]
  min_gap: 5

#model:
#  model_type: "SparseNet"
#  model_params:
#    tau: 8
#    diff_method: "esprit"
#    criterion: "rmspe"

model:
  model_type: "LearnedADMM"
  model_params:
    num_iterations: 10
    subspace_method: "esprit"
    criterion: "rmspe"


training:
  samples_size: 4096
  train_test_ratio: 0.1
  epochs: 30
  batch_size: 128
  optimizer: "Adam"
  learning_rate: 0.0001
  weight_decay: 1e-9
  step_size: 40
  gamma: 0.5
  scheduler: "ReduceLROnPlateau"   # ReduceLROnPlateau
  training_objective: "angle"
  balance_factor: 1.0
  true_doa_train: null
  true_range_train: null
  true_doa_test: null
  true_range_test: null

evaluation:
  criterion: [rmspe, admm_objective]                # [rmspe, admm_objective]
  balance_factor: 1.0
  covariance_reconstruction: "admm"    # [averaging, admm, admm_cvxpy]
  admm_iterations: [10]
#  models:
#    SparseNet:
#      tau: 8
#      diff_method: "esprit"
  augmented_methods: []
  subspace_methods: ["esprit"]

admm_params:
  mu: 2.5e-3
  rho:  2
  max_iter: 10
  tol_primal: 1e-7
  tol_dual: 1e-7

commands:
  create_data: true
  save_dataset: false
  train_model: true
  save_model: true
  evaluate_mode: true
  plot_results: false
  save_plots: false

