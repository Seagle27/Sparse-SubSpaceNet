system_model:
  N: 7
  M: 10
  T: 500
  snr: 10
  eta: 0.0
  bias: 0.0
  sv_noise_var: 0.0
  field_type: "Far"
  signal_nature: "non-coherent"
  array_form: "mra-7"
  antenna_pattern: false
  doa_range: [-70, 70]
  min_gap: 5


admm_params:
  mu: 2.5e-3
  rho:  2


model:
  model_type: "LearnedADMM"
  model_params:
    num_iterations: 20
    subspace_method: "esprit"
    criterion: "rmspe"    # admm_objective, rmspe
    mu: ${admm_params.mu}   # pulled from top-level admm_params
    rho: ${admm_params.rho}  # pulled from top-level admm_params


training:
  samples_size: 8000
  train_test_ratio: 0.25
  epochs: 80
  batch_size: 256
  optimizer: "Adam"
  learning_rate: 5e-4
#  learning_rate: 0.001
  weight_decay: 1e-9
  step_size: 40
  gamma: 0.5
  scheduler: "ReduceLROnPlateau"   # ReduceLROnPlateau
  training_objective: "angle"
  balance_factor: 1.0
  true_doa_train: null
  true_range_train: null
  true_doa_test: null
  true_range_test: null

evaluation:
  criterion: [rmspe]                # [rmspe, admm_objective]
  balance_factor: 1.0
  covariance_reconstruction: "admm"    # [averaging, admm, admm_cvxpy]
  admm_iterations: [20, 200, 500, 1000, 1500]
#  models:
#    SparseNet:
#      tau: 8
#      diff_method: "esprit"
  augmented_methods: []
  subspace_methods: ["esprit"]

commands:
  create_data: true
  save_dataset: false
  train_model: true
  save_model: true
  evaluate_mode: true
  plot_results: true
  save_plots: false

